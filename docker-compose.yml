services:
  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    env_file:
      - ./cart-service/.env
    ports:
      - "3001:3001"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: cart-db
      DB_PORT: 5432
      DB_DATABASE: cartdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      LOG_CHANNEL: stderr
    depends_on:
      cart-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1:3001/up') !== false ? 0 : 1);"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  product-service:
    build: 
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  product-db:
        image: mysql:8.0
        ports:
          - "3306:3306"
        environment:
          - MYSQL_DATABASE=productdb
          - MYSQL_USER=appuser
          - MYSQL_PASSWORD=apppassword
          - MYSQL_ROOT_PASSWORD=rootpassword
        volumes:
          - product-db-data:/var/lib/mysql
          - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
          interval: 10s
          retries: 5
          start_period: 30s
          timeout: 5s

volumes:
  cart-db-data:
  product-db-data: